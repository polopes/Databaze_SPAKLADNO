<!DOCTYPE html>
<html lang="cs">
<body>
    <h1>Nahrat TXT Soubor</h1>
    <form method="post" enctype="multipart/form-data">
        <label for="file">Vyber TXT soubor:</label>
        <input type="file" name="file" accept=".txt" required>
        <button type="submit">Odeslat</button>
    </form>
    {% if content %}
        <h2>Obsah souboru:</h2>
        <pre>{{ content }}</pre>
    {% endif %}
</body>
</html>
